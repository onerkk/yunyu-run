<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#3d9be0">
<title>雲嶼奔跑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2246; --ink-soft:#5a6288; --paper:#fffaf1; --paper-edge:#e6d6bd; --line:#eadcc4;
  --teal:#18908a; --teal-deep:#0d605c; --coral:#ff7b52; --coral-deep:#c4512c;
  --hud:rgba(16,24,58,.46); --hud-ink:#ffffff; --scrim:rgba(14,22,52,.38);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --ink:#f4efe6; --ink-soft:#b5bbd9; --paper:#232a4d; --paper-edge:#11163a; --line:#3a4370; --scrim:rgba(6,10,28,.55); color-scheme:dark; }
}
:root[data-theme="dark"]{ --ink:#f4efe6; --ink-soft:#b5bbd9; --paper:#232a4d; --paper-edge:#11163a; --line:#3a4370; --scrim:rgba(6,10,28,.55); color-scheme:dark; }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
html,body{ margin:0; height:100%; overflow:hidden; }
body{ background:#4aa3e2; color:var(--ink); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; -webkit-tap-highlight-color:transparent; }
#game{ position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
[hidden]{ display:none !important; }
.num{ font-family:"Fredoka","Noto Sans TC",system-ui,sans-serif; font-variant-numeric:tabular-nums; }

/* HUD */
#hud{ position:fixed; left:0; right:0; top:0; z-index:5; pointer-events:none; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px); }
.chip{ background:var(--hud); color:var(--hud-ink); border-radius:999px; padding:6px 13px; font-weight:700; font-size:17px; line-height:1.2; white-space:nowrap;
  display:inline-flex; align-items:center; gap:7px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); box-shadow:inset 0 -2px 0 rgba(0,0,0,.18); }
.hud-l{ display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
#hearts{ display:flex; gap:4px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.28)); }
#hearts svg{ width:28px; height:26px; display:block; transition:transform .2s; }
#hearts .off{ opacity:.28; transform:scale(.86); }
.hud-r{ display:flex; gap:8px; align-items:center; }
.icon-btn{ pointer-events:auto; width:44px; height:44px; border-radius:50%; border:0; background:var(--hud); color:#fff; display:grid; place-items:center;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); cursor:pointer; touch-action:manipulation; }
.icon-btn svg{ width:18px; height:18px; }
.gem-ico{ width:14px; height:19px; background:linear-gradient(160deg,#f6dcff,#c77dff 55%,#7d36d6); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); }
#gems-chip.bump{ animation:bump .32s ease-out; }
@keyframes bump{ 0%{ transform:scale(1); } 40%{ transform:scale(1.16); } 100%{ transform:scale(1); } }
.mini-hero{ width:16px; height:16px; border-radius:50%; background:#fff3e2; box-shadow:inset 0 -4px 0 #18908a; transition:transform .25s, box-shadow .25s; }
.mini-hero.f1{ transform:scale(1.25); }
.mini-hero.f2{ transform:scale(1.25); box-shadow:inset 0 -4px 0 #8fd23a, 0 0 0 2px #c8f07a; }

#bossbar{ position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 62px); transform:translateX(-50%); width:min(64vw,520px); z-index:5; pointer-events:none;
  display:flex; flex-direction:column; gap:4px; align-items:stretch; transition:opacity .4s; }
#bossbar .bname{ color:#fff; font-weight:900; font-size:16px; letter-spacing:.12em; text-align:center; text-shadow:0 2px 0 rgba(40,0,40,.5); }
#bossbar .btrack{ position:relative; height:14px; border-radius:8px; background:rgba(16,10,40,.6); box-shadow:inset 0 0 0 2px rgba(255,255,255,.55); overflow:hidden; }
#bossbar .bghost, #bossbar .bfill{ position:absolute; left:2px; top:2px; bottom:2px; border-radius:6px; }
#bossbar .bghost{ background:#fff; transition:width .8s .25s; }
#bossbar .bfill{ background:linear-gradient(90deg,#ff4f8b,#c77dff); transition:width .2s; }
#bossbar.p2 .bfill{ background:linear-gradient(90deg,#ff3b3b,#ff7a3b); }

#banner{ position:fixed; left:50%; top:28%; transform:translate(-50%,-50%) scale(.92); opacity:0; transition:opacity .4s, transform .4s; z-index:6;
  pointer-events:none; text-align:center; color:#fff; text-shadow:0 3px 0 rgba(12,50,70,.45), 0 10px 26px rgba(0,0,0,.3); white-space:nowrap; }
#banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
#banner .b-id{ display:block; font-family:"Fredoka","Noto Sans TC",system-ui,sans-serif; font-size:20px; letter-spacing:.08em; opacity:.92; }
#banner .b-name{ display:block; font-weight:900; font-size:clamp(30px,7vw,54px); letter-spacing:.06em; }
#banner.boss .b-name{ color:#ffe1f0; text-shadow:0 3px 0 #6a1d5a, 0 0 28px rgba(255,80,160,.7); }
#toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 140px); transform:translate(-50%,10px); opacity:0; transition:opacity .3s, transform .3s;
  z-index:6; pointer-events:none; background:rgba(255,250,240,.95); color:#1b2246; font-weight:700; padding:9px 16px; border-radius:999px; box-shadow:0 4px 0 rgba(0,0,0,.15); white-space:nowrap; }
#toast.show{ opacity:1; transform:translate(-50%,0); }
#hint{ position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 112px); transform:translate(-50%,-8px); opacity:0; transition:opacity .35s, transform .35s; z-index:6;
  pointer-events:none; width:max-content; max-width:min(88vw,540px); background:rgba(255,250,240,.96); color:#1b2246; font-weight:700; font-size:15px; line-height:1.5;
  padding:10px 16px; border-radius:16px; box-shadow:0 5px 0 rgba(0,0,0,.14); text-align:center; }
#hint.show{ opacity:1; transform:translate(-50%,0); }
#hint kbd{ font:700 13px/1 "Fredoka",system-ui,sans-serif; background:#1b2246; color:#fff; border-radius:6px; padding:3px 6px; }
#fade{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s; z-index:8; }
#vignette{ position:fixed; inset:0; pointer-events:none; z-index:4; opacity:0; transition:opacity .6s;
  background:radial-gradient(ellipse at center, rgba(255,40,60,0) 52%, rgba(255,40,70,.5) 100%); }
#vignette.on{ opacity:1; transition:opacity .05s; }

/* touch */
#touch{ position:fixed; inset:0; pointer-events:none; z-index:6; }
#pad{ position:absolute; left:calc(env(safe-area-inset-left,0px) + 18px); bottom:calc(env(safe-area-inset-bottom,0px) + 18px); width:200px; height:94px; border-radius:47px;
  background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.55); pointer-events:auto; display:flex; touch-action:none;
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
#pad .arr{ flex:1; position:relative; border-radius:45px; transition:background .08s; }
#pad .arr::after{ content:""; position:absolute; top:50%; left:50%; border:15px solid transparent; transform:translate(-50%,-50%); }
#pad .arr-l::after{ border-right:22px solid rgba(255,255,255,.95); border-left-width:0; margin-left:-3px; }
#pad .arr-r::after{ border-left:22px solid rgba(255,255,255,.95); border-right-width:0; margin-left:3px; }
#pad.l-on .arr-l, #pad.r-on .arr-r{ background:rgba(255,255,255,.32); }
.tbtn{ position:absolute; border-radius:50%; border:2px solid rgba(255,255,255,.65); color:#fff; font:900 22px/1 "Noto Sans TC",system-ui,sans-serif;
  pointer-events:auto; touch-action:none; transition:transform .05s, box-shadow .05s, opacity .2s; display:grid; place-items:center; }
.tbtn.on{ transform:translateY(4px); }
#tjump{ right:calc(env(safe-area-inset-right,0px) + 20px); bottom:calc(env(safe-area-inset-bottom,0px) + 20px); width:100px; height:100px; font-size:26px;
  background:rgba(255,123,82,.6); box-shadow:0 6px 0 rgba(150,50,20,.45); }
#tjump.on{ box-shadow:0 2px 0 rgba(150,50,20,.45); background:rgba(255,123,82,.8); }
#tpound{ right:calc(env(safe-area-inset-right,0px) + 134px); bottom:calc(env(safe-area-inset-bottom,0px) + 26px); width:70px; height:70px;
  background:rgba(70,90,170,.58); box-shadow:0 5px 0 rgba(20,30,90,.45); }
#tpound.on{ box-shadow:0 1px 0 rgba(20,30,90,.45); background:rgba(70,90,170,.8); }
#tthrow{ right:calc(env(safe-area-inset-right,0px) + 35px); bottom:calc(env(safe-area-inset-bottom,0px) + 134px); width:70px; height:70px;
  background:rgba(110,180,50,.62); box-shadow:0 5px 0 rgba(40,90,10,.45); }
#tthrow.on{ box-shadow:0 1px 0 rgba(40,90,10,.45); background:rgba(110,180,50,.85); }
@media (max-width:440px){
  #pad{ width:160px; height:84px; }
  #tjump{ width:92px; height:92px; }
  #tpound{ right:calc(env(safe-area-inset-right,0px) + 122px); width:62px; height:62px; font-size:20px; }
  #tthrow{ right:calc(env(safe-area-inset-right,0px) + 35px); bottom:calc(env(safe-area-inset-bottom,0px) + 124px); width:62px; height:62px; font-size:20px; }
}

/* screens */
.screen{ position:fixed; inset:0; z-index:10; display:grid; place-items:center; overflow:auto; touch-action:pan-y;
  padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px); }
.screen.dim{ background:var(--scrim); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
#scr-title{ background:linear-gradient(to bottom, rgba(10,30,70,0) 35%, rgba(10,25,60,.38)); }
.title-wrap{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; }
.wordmark{ margin:0; font-weight:900; font-size:clamp(40px, min(12vw, 15vh), 104px); line-height:1.08; letter-spacing:.07em; color:#fff;
  text-shadow:0 1px 0 #27a59e,0 2px 0 #229891,0 3px 0 #1d8b85,0 4px 0 #187e79,0 5px 0 #14716d,0 6px 0 #106561,0 7px 0 #0c5956,0 8px 0 #094d4b,
    0 16px 26px rgba(6,28,58,.45); }
.tagline{ margin:0; color:#fff; font-weight:700; font-size:clamp(14px,3.4vw,18px); background:rgba(12,36,66,.38); padding:6px 15px; border-radius:999px; }
.menu{ display:flex; flex-direction:column; gap:12px; width:min(78vw,300px); }
.hint{ margin:0; color:#fff; font-size:14px; line-height:1.6; opacity:.94; text-shadow:0 1px 3px rgba(0,0,0,.5); max-width:36em; }
.ver{ position:fixed; right:calc(env(safe-area-inset-right,0px) + 12px); bottom:calc(env(safe-area-inset-bottom,0px) + 8px); color:#fff; opacity:.75; font-size:12px; }
@media (max-height:520px) and (orientation:landscape){
  .title-wrap{ gap:9px; } .title-wrap .menu{ flex-direction:row; width:auto; } .title-wrap .menu .btn{ padding:11px 18px; }
  .panel{ width:min(92vw,540px); padding:18px; gap:12px; } .panel .menu{ display:grid; grid-template-columns:1fr 1fr; } .panel h2{ font-size:22px; }
}
.panel{ background:var(--paper); color:var(--ink); border-radius:24px; padding:22px; width:min(92vw,420px); display:flex; flex-direction:column; gap:14px;
  box-shadow:0 7px 0 var(--paper-edge), 0 22px 50px rgba(8,16,40,.35); max-height:calc(100dvh - 40px); overflow:auto; }
.panel h2{ margin:0; font-size:26px; font-weight:900; letter-spacing:.04em; }
.panel .menu{ width:100%; }
.note{ margin:0; color:var(--ink-soft); font-size:15px; line-height:1.6; }
.btn{ appearance:none; border:0; font:inherit; font-weight:700; font-size:18px; color:#fff; background:var(--teal); border-radius:16px; padding:13px 20px;
  box-shadow:0 5px 0 var(--teal-deep); cursor:pointer; transition:transform .06s, box-shadow .06s; touch-action:manipulation; }
.btn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--teal-deep); }
.btn.primary{ background:var(--coral); box-shadow:0 5px 0 var(--coral-deep); }
.btn.primary:active{ box-shadow:0 1px 0 var(--coral-deep); }
.btn.big{ font-size:21px; padding:16px 22px; }
.btn.ghost{ background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--line); }
.btn.ghost:active{ box-shadow:inset 0 0 0 2px var(--line); }
#scr-title .btn.ghost{ color:#fff; box-shadow:inset 0 0 0 2px rgba(255,255,255,.7); }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
:focus-visible{ outline:3px solid #ffd34d; outline-offset:3px; }
.level-list{ display:flex; flex-direction:column; gap:10px; }
.lv{ display:grid; grid-template-columns:auto 1fr; gap:2px 14px; align-items:center; text-align:left; width:100%; }
.lv .lv-id{ grid-row:span 2; font-family:"Fredoka",system-ui,sans-serif; font-size:26px; }
.lv .lv-name{ font-size:19px; }
.lv .lv-best{ font-size:13px; font-weight:500; opacity:.9; }
.lv.boss{ background:#7a3f9a; box-shadow:0 5px 0 #4b2063; }
.row{ display:flex; align-items:center; justify-content:space-between; gap:12px; font-weight:700; font-size:18px; }
.toggle{ appearance:none; border:0; width:64px; height:36px; border-radius:18px; background:var(--line); position:relative; cursor:pointer; flex:none; }
.toggle::after{ content:""; position:absolute; top:4px; left:4px; width:28px; height:28px; border-radius:50%; background:#fff; box-shadow:0 2px 0 rgba(0,0,0,.2); transition:left .15s; }
.toggle[aria-checked="true"]{ background:var(--teal); }
.toggle[aria-checked="true"]::after{ left:32px; }
.seg{ display:flex; background:var(--line); border-radius:12px; padding:3px; flex:none; }
.seg button{ appearance:none; border:0; background:transparent; font:inherit; font-size:15px; font-weight:700; color:var(--ink); padding:7px 11px; border-radius:9px; cursor:pointer; }
.seg button[aria-pressed="true"]{ background:var(--paper); box-shadow:0 2px 0 rgba(0,0,0,.12); }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
.stats div{ background:var(--line); border-radius:14px; padding:10px 4px; display:flex; flex-direction:column; gap:2px; }
.stats b{ font-family:"Fredoka",system-ui,sans-serif; font-size:24px; }
.stats span{ font-size:13px; color:var(--ink-soft); }
.howto{ display:grid; grid-template-columns:auto 1fr; gap:8px 12px; font-size:15px; line-height:1.5; margin:0; }
.howto dt{ font-weight:900; white-space:nowrap; }
.howto dd{ margin:0; color:var(--ink-soft); }
#err{ position:fixed; left:12px; right:12px; bottom:12px; z-index:50; background:#fff3f0; color:#7a1d0e; border:2px solid #ff9a80; border-radius:14px; padding:12px 14px;
  font:600 14px/1.5 system-ui,sans-serif; white-space:pre-wrap; max-height:40vh; overflow:auto; -webkit-user-select:text; user-select:text; }
@media (prefers-reduced-motion:reduce){ #banner,#toast,#fade,#hint,.btn{ transition:none; } #gems-chip.bump{ animation:none; } }
</style>
</head>
<body>
<canvas id="game" aria-label="遊戲畫面"></canvas>
<div id="vignette"></div>

<div id="hud" hidden>
  <div class="hud-l">
    <div id="hearts" aria-label="體力"></div>
    <div class="chip"><span class="mini-hero" id="form-ico" aria-hidden="true"></span><span class="num" id="lives">×3</span></div>
  </div>
  <div class="chip" id="gems-chip"><span class="gem-ico" aria-hidden="true"></span><span class="num" id="gems">0 / 0</span></div>
  <div class="hud-r">
    <span class="chip num" id="timer">0:00</span>
    <button class="icon-btn" id="btn-pause" aria-label="暫停"><svg viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="11" y="2" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>
  </div>
</div>
<div id="bossbar" hidden><span class="bname">晶甲王</span><div class="btrack"><div class="bghost"></div><div class="bfill"></div></div></div>
<div id="banner" aria-live="polite"></div>
<div id="toast" aria-live="polite"></div>
<div id="hint" aria-live="polite"></div>
<div id="fade"></div>

<div id="touch" hidden>
  <div id="pad" role="group" aria-label="左右移動"><span class="arr arr-l"></span><span class="arr arr-r"></span></div>
  <button class="tbtn" id="tjump" aria-label="跳躍">跳</button>
  <button class="tbtn" id="tpound" aria-label="下砸">砸</button>
  <button class="tbtn" id="tthrow" aria-label="丟回力葉" hidden>丟</button>
</div>

<section id="scr-title" class="screen" hidden>
  <div class="title-wrap">
    <h1 class="wordmark">雲嶼奔跑</h1>
    <p class="tagline">跳過浮島、收集星晶，打倒晶洞裡的魔王</p>
    <div class="menu">
      <button class="btn primary big" id="btn-start">開始冒險</button>
      <button class="btn" id="btn-levels">選擇關卡</button>
      <button class="btn ghost" id="btn-howto">操作說明</button>
      <button class="btn ghost" id="btn-settings">設定</button>
    </div>
    <p class="hint" id="hint-rotate" hidden>手機橫放，視野會更寬</p>
  </div>
  <span class="ver num" id="ver"></span>
</section>

<section id="scr-howto" class="screen dim" hidden>
  <div class="panel">
    <h2>操作說明</h2>
    <dl class="howto" id="howto-list"></dl>
    <p class="note">嫩芽果讓小苔變大，疾風葉讓小苔可以丟回力葉。變大後受傷只會縮小一級，不扣體力。</p>
    <button class="btn" id="btn-howto-done">知道了</button>
  </div>
</section>

<section id="scr-levels" class="screen dim" hidden>
  <div class="panel">
    <h2>選擇關卡</h2>
    <div class="level-list" id="level-list"></div>
    <button class="btn ghost" id="btn-levels-back">返回</button>
  </div>
</section>

<section id="scr-settings" class="screen dim" hidden>
  <div class="panel">
    <h2>設定</h2>
    <div class="row"><span>音效</span><button class="toggle" id="tg-sfx" role="switch" aria-label="音效"></button></div>
    <div class="row"><span>音樂</span><button class="toggle" id="tg-music" role="switch" aria-label="音樂"></button></div>
    <div class="row"><span>畫質</span><div class="seg" id="seg-q"><button data-q="high">極致</button><button data-q="std">標準</button><button data-q="eco">省電</button></div></div>
    <p class="note">極致：光暈與即時陰影全開。標準：保留陰影、關掉光暈。手機發燙或卡頓時切到省電。</p>
    <button class="btn" id="btn-settings-done">完成</button>
  </div>
</section>

<section id="scr-pause" class="screen dim" hidden>
  <div class="panel">
    <h2>暫停</h2>
    <div class="menu">
      <button class="btn primary" id="btn-resume">繼續</button>
      <button class="btn" id="btn-restart">重新開始本關</button>
      <button class="btn" id="btn-pause-settings">設定</button>
      <button class="btn ghost" id="btn-quit">回到標題</button>
    </div>
  </div>
</section>

<section id="scr-result" class="screen dim" hidden>
  <div class="panel">
    <h2 id="res-title">過關！</h2>
    <div class="stats">
      <div><b id="res-gems">0</b><span>星晶</span></div>
      <div><b id="res-time">0:00</b><span>時間</span></div>
      <div><b id="res-stomp">0</b><span>擊退</span></div>
    </div>
    <p class="note" id="res-note"></p>
    <div class="menu">
      <button class="btn primary" id="btn-next">下一關</button>
      <button class="btn" id="btn-retry">再玩一次</button>
      <button class="btn ghost" id="btn-home">回到標題</button>
    </div>
  </div>
</section>

<section id="scr-over" class="screen dim" hidden>
  <div class="panel">
    <h2>生命用完了</h2>
    <p class="note">重新挑戰會從這一關的起點開始。</p>
    <div class="menu">
      <button class="btn primary" id="btn-over-retry">重新挑戰本關</button>
      <button class="btn ghost" id="btn-over-home">回到標題</button>
    </div>
  </div>
</section>

<div id="err" hidden></div>
<script>
(function(){
  var shown = {};

<script>
(function(){

/* bloom: the render target is tagged sRGB so every material writes display-ready colour into it,

initComposer();

/* scratch */
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _e = new THREE.Euler(), _c = new THREE.Color();

/* shared shader uniforms */

const RIM = { color:{ value:new THREE.Color(1,1,1) }, str:{ value:0.35 } };

    sh.uniforms.uRimColor = RIM.color; sh.uniforms.uRimStr = RIM.str;
    sh.fragmentShader = 'uniform vec3 uRimColor;\nuniform float uRimStr;\n' + sh.fragmentShader.replace('#include <tonemapping_fragment>',

function addWind(mat, amp, mode){
  const a = amp.toFixed(3), b = (amp*0.6).toFixed(3);

    sh.uniforms.uWind = WIND;

      ? '#include <begin_vertex>\n{ vec4 wp0 = instanceMatrix * vec4(0.0,0.0,0.0,1.0); float hh = max(position.y, 0.0);\n transformed.x += sin(uWind*2.1 + wp0.x*0.9 + wp0.z*0.7) * '+a+' * hh;\n transformed.z += cos(uWind*1.7 + wp0.x*0.6) * '+b+' * hh; }'

/* ================= geometry utils ================= */
function xform(geo, pos, rot, scl){

  _e.set(rot ? rot[0] : 0, rot ? rot[1] : 0, rot ? rot[2] : 0);
  _q.setFromEuler(_e);
  _m.compose(_p.set(pos ? pos[0] : 0, pos ? pos[1] : 0, pos ? pos[2] : 0), _q, _s.set(scl ? scl[0] : 1, scl ? scl[1] : 1, scl ? scl[2] : 1));

  for (let i=0;i<p.count;i++){ fn(p.getX(i), p.getY(i), p.getZ(i), c); arr[i*3]=c.r; arr[i*3+1]=c.g; arr[i*3+2]=c.b; }

}

  const y0 = g.boundingBox.min.y, y1 = g.boundingBox.max.y, A = lin(hexA), B = lin(hexB), S = snow ? lin(snow.c) : null;

}

  const p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
  for (let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i), nx=Math.abs(n.getX(i)), ny=Math.abs(n.getY(i));

}

  const pos = new Float32Array(n*3), nor = new Float32Array(n*3), uv = new Float32Array(n*2);

const SPH = (r, w=20, h=14) => new THREE.SphereGeometry(r, w, h);

/* ================= textures ================= */
function makeCanvas(s){ const c = document.createElement('canvas'); c.width = c.height = s; return c; }

function soilTexture(){
  const s=256, c=makeCanvas(s), g=c.getContext('2d'), r=rng(11);
  g.fillStyle='#a97852'; g.fillRect(0,0,s,s);
  for (let i=0;i<10;i++){ const y=r()*s, h=6+r()*18; g.fillStyle = r()<0.5 ? `rgba(70,42,24,${0.08+r()*0.1})` : `rgba(210,170,125,${0.08+r()*0.1})`; g.fillRect(0,y,s,h); if (y+h>s) g.fillRect(0,y-s,s,h); }
  for (let i=0;i<1700;i++){ const d=r()<0.55; g.fillStyle = d ? `rgba(55,32,18,${0.15+r()*0.3})` : `rgba(255,228,190,${0.1+r()*0.25})`; const z=1+r()*2.2; g.fillRect(r()*s, r()*s, z, z); }
  for (let i=0;i<30;i++){
    const x=r()*s, y=r()*s, rx=3+r()*10, ry=rx*(0.55+r()*0.3), rot=r()*Math.PI, l=40+r()*22, h=22+r()*16;
    wrapped(s,x,y,rx+3,(px,py)=>{
      g.fillStyle='rgba(50,30,15,0.35)'; g.beginPath(); g.ellipse(px+1.5,py+2,rx,ry,rot,0,Math.PI*2); g.fill();
      g.fillStyle=`hsl(${h},18%,${l}%)`; g.beginPath(); g.ellipse(px,py,rx,ry,rot,0,Math.PI*2); g.fill();
      g.fillStyle='rgba(255,255,255,0.22)'; g.beginPath(); g.ellipse(px-rx*0.25,py-ry*0.3,rx*0.45,ry*0.35,rot,0,Math.PI*2); g.fill();
    });
  }

}
function grassTexture(){
  const s=256, c=makeCanvas(s), g=c.getContext('2d'), r=rng(23);
  g.fillStyle='#7cc552'; g.fillRect(0,0,s,s);
  for (let i=0;i<40;i++){
    const x=r()*s, y=r()*s, rad=10+r()*30, light=r()<0.5;
    wrapped(s,x,y,rad,(px,py)=>{ const gr=g.createRadialGradient(px,py,0,px,py,rad); gr.addColorStop(0, light?'rgba(195,240,120,0.28)':'rgba(40,110,40,0.28)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(px-rad,py-rad,rad*2,rad*2); });

}
function stoneTexture(){
  const s=256, c=makeCanvas(s), g=c.getContext('2d'), r=rng(37);
  g.fillStyle='#4e5563'; g.fillRect(0,0,s,s);
  const rows=4, rh=s/rows;
  for (let j=0;j<rows;j++){
    const n=4+Math.floor(r()*2), ws=[]; let tot=0;
    for (let i=0;i<n;i++){ const w=0.7+r()*0.6; ws.push(w); tot+=w; }
    let x=r()*s;
    for (let i=0;i<n;i++){
      const w=ws[i]/tot*s, l=50+r()*16, hue=205+r()*30;
      for (const ox of [0,-s]){
        const bx=x+ox, by=j*rh, pad=3;
        roundRect(g,bx+pad,by+pad,w-pad*2,rh-pad*2,10); g.fillStyle=`hsl(${hue},12%,${l}%)`; g.fill();
        roundRect(g,bx+pad+3,by+pad+3,w-pad*2-6,(rh-pad*2)*0.32,8); g.fillStyle='rgba(255,255,255,0.13)'; g.fill();
        roundRect(g,bx+pad+3,by+rh-pad-10,w-pad*2-6,7,4); g.fillStyle='rgba(0,0,0,0.12)'; g.fill();
      }
      x+=w;
    }
  }
  for (let i=0;i<900;i++){ g.fillStyle = r()<0.5 ? `rgba(0,0,0,${r()*0.18})` : `rgba(255,255,255,${r()*0.14})`; g.fillRect(r()*s,r()*s,1+r()*2,1+r()*2); }
  g.strokeStyle='rgba(20,24,32,0.35)'; g.lineWidth=1.2;
  for (let i=0;i<7;i++){ let x=r()*s, y=r()*s; g.beginPath(); g.moveTo(x,y); for (let k=0;k<4;k++){ x+=(r()-0.5)*26; y+=r()*14; g.lineTo(x,y); } g.stroke(); }
  return texFrom(c);
}
function woodTexture(){
  const s=256, c=makeCanvas(s), g=c.getContext('2d'), r=rng(53);
  const boards=4, bh=s/boards;
  for (let j=0;j<boards;j++){
    const l=42+r()*10; g.fillStyle=`hsl(28,45%,${l}%)`; g.fillRect(0,j*bh,s,bh);
    for (let k=0;k<14;k++){ g.strokeStyle=`rgba(80,45,20,${0.12+r()*0.18})`; g.lineWidth=1+r()*1.5; const y0=j*bh+4+r()*(bh-8), ph=r()*6, amp=1+r()*2.5;
      g.beginPath(); for (let x=0;x<=s;x+=8){ const y=y0+Math.sin(x/s*Math.PI*4+ph)*amp; if (x===0) g.moveTo(x,y); else g.lineTo(x,y); } g.stroke(); }
    g.fillStyle='rgba(255,230,190,0.18)'; g.fillRect(0,j*bh+2,s,3);
    g.fillStyle='rgba(40,20,8,0.55)'; g.fillRect(0,j*bh+bh-3,s,3);
    for (const nx of [18, s-18]){ g.fillStyle='#3b3b40'; g.beginPath(); g.arc(nx,j*bh+bh/2,3.2,0,Math.PI*2); g.fill(); }
  }

function crackTextures(){
  const s=256, c=makeCanvas(s), g=c.getContext('2d'), r=rng(71);
  g.fillStyle='#4b5161'; g.fillRect(0,0,s,s);
  roundRect(g,8,8,s-16,s-16,30); g.fillStyle='#8790a6'; g.fill();
  roundRect(g,18,16,s-36,(s-32)*0.3,22); g.fillStyle='rgba(255,255,255,0.14)'; g.fill();
  roundRect(g,18,s-46,s-36,26,14); g.fillStyle='rgba(0,0,0,0.14)'; g.fill();
  for (let i=0;i<800;i++){ g.fillStyle = r()<0.5 ? `rgba(0,0,0,${r()*0.2})` : `rgba(255,255,255,${r()*0.15})`; g.fillRect(r()*s,r()*s,1+r()*2,1+r()*2); }

function glowTexture(){

  for (let i=0;i<500;i++){ g.fillStyle = r()<0.7 ? `rgba(255,255,255,${0.5+r()*0.5})` : `rgba(140,170,220,${r()*0.3})`; g.fillRect(r()*s,r()*s,1+r()*1.5,1+r()*1.5); }

function sandTexture(){

const CRACK_TEX = crackTextures();

/* ================= themes ================= */

class Builder {
  constructor(W,H){ this.W=W; this.H=H; this.grid=new Uint8Array(W*H); this.gems=[]; this.hearts=[]; this.enemies=[]; this.springs=[]; this.movers=[]; this.checks=[];
    this.cracks=[]; this.bubbles=[]; this.hints=[]; this.goal=null; this.start={x:2.5,y:3}; this.arena=null; }
  set(x,y,t){ if (x>=0&&x<this.W&&y>=0&&y<this.H) this.grid[y*this.W+x]=t; }
  ground(x0,x1,h,y0=0){ for (let x=x0;x<x1;x++) for (let y=y0;y<h;y++) this.set(x,y,1); }
  stone(x,y,w=1,h=1){ for (let i=0;i<w;i++) for (let j=0;j<h;j++) this.set(x+i,y+j,2); }
  plank(x,y,w){ for (let i=0;i<w;i++) this.set(x+i,y,3); }
  crack(x,y,content){ this.set(x,y,4); this.cracks.push({x,y,content:content||''}); }
  top(x){ for (let y=this.H-1;y>=0;y--){ if (this.grid[y*this.W+x]===1) return y+1; } return 0; }
  gem(x,y){ this.gems.push({x:x+0.5,y:y+0.5}); }
  gemRow(x,y,n){ for (let i=0;i<n;i++) this.gem(x+i,y); }
  gemArc(x,y,n,h=1.5){ for (let i=0;i<n;i++){ const t = n===1 ? 0.5 : i/(n-1); this.gems.push({x:x+i+0.5, y:y+0.5+Math.sin(t*Math.PI)*h}); } }
  heart(x,y){ this.hearts.push({x:x+0.5,y:y+0.5}); }
  bubble(x,y,kind,respawn){ this.bubbles.push({x:x+0.5,y:y+0.5,kind,respawn:!!respawn}); }
  enemy(kind,x,y){ this.enemies.push({kind, x:x+0.5, y: y==null ? this.top(x) : y}); }
  bee(x,y){ this.enemies.push({kind:'bee', x:x+0.5, y:y+0.25}); }
  spring(x){ this.springs.push({x:x+0.5, y:this.top(x)}); }
  mover(x,y,w,dx,dy,period,phase=0){ this.movers.push({x0:x,y0:y,w,dx,dy,period,phase}); }
  checkpoint(x){ this.checks.push({x:x+0.5, y:this.top(x)}); }
  goalAt(x){ this.goal={x:x+0.5, y:this.top(x)}; }
  startAt(x){ this.start={x:x+0.5, y:this.top(x)}; }
  hint(x,id,html){ this.hints.push({x,id,html}); }
}

  tick(){
    if (!this.ctx || !this.playing) return;

    while (this.next < now + 0.2){
      const s = this.step % 32, bar = (s/8)|0, i = s % 8;

/* ================= level construction ================= */
const SOIL_Z0=-2.8, SOIL_Z1=1.2, STONE_Z0=-1.3, STONE_Z1=0.95, PLANK_Z0=-1.05, PLANK_Z1=0.85;

function columnRuns(B, type){
  const byKey = new Map();
  for (let x=0;x<B.W;x++){ let y=0; while (y<B.H){ if (B.grid[y*B.W+x]===type){ let y1=y; while (y1<B.H && B.grid[y1*B.W+x]===type) y1++; const k=y+','+y1; if (!byKey.has(k)) byKey.set(k,[]); byKey.get(k).push(x); y=y1; } else y++; } }
  const out = [];
  byKey.forEach((xs,k) => { const ys = k.split(',').map(Number); let s=xs[0], p=xs[0];
    for (let i=1;i<=xs.length;i++){ if (i<xs.length && xs[i]===p+1){ p=xs[i]; continue; } out.push({x0:s,x1:p+1,y0:ys[0],y1:ys[1]}); if (i<xs.length){ s=p=xs[i]; } } });
  return out;
}
function topRuns(B, type){
  const out = [], cell = (x,y) => (x<0||x>=B.W||y<0||y>=B.H) ? 0 : B.grid[y*B.W+x], cover = t => t===1||t===2;
  for (let y=0;y<B.H;y++){ let x=0; while (x<B.W){ if (B.grid[y*B.W+x]===type && !cover(cell(x,y+1))){ let x1=x; while (x1<B.W && B.grid[y*B.W+x1]===type && !cover(cell(x1,y+1))) x1++; out.push({x0:x,x1,y:y+1}); x=x1; } else x++; } }

function spawnWave(L, x, dir, speed){
  const mesh = new THREE.Mesh(GEO.wave, MAT.wave); mesh.position.set(x, L.arena.floor, 0); L.group.add(mesh);
  const halo = new THREE.Mesh(GEO.halo, MAT.glowPink); halo.scale.set(1.2, 1.0, 1); halo.position.set(0, 0.35, 0.2); mesh.add(halo);
  L.waves.push({ x, dir, speed, mesh, t:0 });
}
function fireShards(L, b){
  const A = L.arena, sx = b.x, sy = b.floor + 2.9, T = 1.15, g = 18;
  for (let i=0;i<5;i++){
    const tx = clamp(P.x + (i-2)*1.7, A.x0 + 0.6, A.x1 - 0.6), vx = (tx - sx)/T, vy = ((b.floor + 0.2) - sy + 0.5*g*T*T)/T;
    const mesh = new THREE.Mesh(GEO.shard, MAT.shard); mesh.castShadow = true; mesh.position.set(sx, sy, 0); L.group.add(mesh);
    L.shards.push({ x:sx, y:sy, vx, vy, g, mesh });
  }
  Sound.sfx('shard'); burst(sx, sy, 0.5, 14, {colors:PC.crystal2, radial:true, speed:4, up:1, grav:2, size:0.08, life:0.5});
}
function clearHazards(L){
  for (const w of L.waves) L.group.remove(w.mesh); L.waves.length = 0;
  for (const s of L.shards) L.group.remove(s.mesh); L.shards.length = 0;
}

/* ================= build ================= */
function buildLevel(def){
  const T = THEMES[def.theme];
  const B = new Builder(def.width, 28); def.build(B);
  const W = B.W, H = B.H, grid = B.grid;
  const R = rng(def.seed || 1);
  const group = new THREE.Group(); scene.add(group);
  const own = [];
  const keep = o => { own.push(o); return o; };
  const addMesh = (geo, mat, cast, recv) => { const m = new THREE.Mesh(geo, mat); m.castShadow = !!cast; m.receiveShadow = !!recv; group.add(m); return m; };
  const L = { def, T, W, H, grid, t:0, group, own, start:B.start, goal:B.goal, arena:B.arena, goalActive:!B.arena,
    leaves:[], waves:[], shards:[], items:[], hints:B.hints.map(h => Object.assign({ shown:false }, h)),
    type(x,y){ if (x<0||x>=W) return 1; if (y<0||y>=H) return 0; return grid[y*W+x]; } };

  const mSoil = keep(new THREE.MeshStandardMaterial({ map:TEX.soil, color:lin(T.soilTint), vertexColors:true, roughness:0.95 }));
  const mGrass = keep(new THREE.MeshStandardMaterial({ map:TEX[T.capTex || 'grass'], color:lin(T.grassTint), vertexColors:true, roughness:0.85 }));
  const mStone = keep(new THREE.MeshStandardMaterial({ map:TEX.stone, color:lin(T.stoneTint), vertexColors:true, roughness:0.75 }));
  const mWood = keep(new THREE.MeshStandardMaterial({ map:TEX.wood, color:lin(T.woodTint), vertexColors:true, roughness:0.7 }));
  const mFlat = keep(new THREE.MeshStandardMaterial({ vertexColors:true, flatShading:true, roughness:0.9 }));
  const mLeaf = keep(addWind(new THREE.MeshStandardMaterial({ vertexColors:true, flatShading:true, roughness:0.85 }), 0.045, 'leaf'));
  const mFar = keep(new THREE.MeshStandardMaterial({ vertexColors:true, flatShading:true, roughness:1 }));
  MAT.stoneShared.color.copy(lin(T.stoneTint));

  /* soil */
  const soilG = [];
  for (const r of columnRuns(B,1)){
    const bottom = r.y0 === 0 ? -3.4 : r.y0;
    const g = boxGeo(r.x0, bottom, SOIL_Z0, r.x1, r.y1, SOIL_Z1); triUV(g,0.5);
    paint(g,(x,y,z,c)=>{ const k = clamp(1-(r.y1-y)/5.5,0,1), v = 0.34+0.66*k; c.setRGB(v,v*0.96,v*0.92); });
    soilG.push(g);
    if (r.y0 > 0){
      for (let x=r.x0;x<r.x1;x++){
        const n = R() < 0.6 ? 2 : 1;
        for (let k=0;k<n;k++){
          const rr = 0.3+R()*0.35, hh = 0.6+R()*1.2*Math.min(2,(r.y1-r.y0)/2), cy = r.y0 - hh/2 + 0.05;
          const g2 = xform(new THREE.ConeGeometry(rr,hh,6,1), [x+0.2+R()*0.6, cy, lerp(SOIL_Z0+0.5, SOIL_Z1-0.4, R())], [Math.PI, R()*3, 0]);
          triUV(g2,0.5); paint(g2,(px,py,pz,c)=>{ const v = 0.22 + 0.3*clamp((py-(r.y0-hh))/hh,0,1); c.setRGB(v,v*0.95,v*0.9); }); soilG.push(g2);
        }
      }
    }
  }
  if (soilG.length) addMesh(keep(mergeGeos(soilG)), mSoil, true, true);

  /* waterline foam */
  const foamG = [];
  for (const r of columnRuns(B,1)) if (r.y0 === 0){
    foamG.push(boxGeo(r.x0-0.12, -2.64, SOIL_Z1-0.05, r.x1+0.12, -2.5, SOIL_Z1+0.28));
    foamG.push(boxGeo(r.x0-0.28, -2.64, SOIL_Z0-0.1, r.x0+0.02, -2.5, SOIL_Z1+0.28));
    foamG.push(boxGeo(r.x1-0.02, -2.64, SOIL_Z0-0.1, r.x1+0.28, -2.5, SOIL_Z1+0.28));
  }
  const foamMat = keep(new THREE.MeshBasicMaterial({ color:lin(T.foam), transparent:true, opacity:0.55, depthWrite:false, toneMapped:false }));
  if (foamG.length) addMesh(keep(mergeGeos(foamG.map(g => paint(g,(x,y,z,c)=>c.setRGB(1,1,1))))), foamMat, false, false);

  /* grass caps + moss on stone */
  const grassG = [], fringeL = [];
  for (const r of topRuns(B,1)){
    const g = boxGeo(r.x0-0.07, r.y-0.34, SOIL_Z0-0.06, r.x1+0.07, r.y+0.02, SOIL_Z1+0.08); triUV(g,0.6);
    paint(g,(x,y,z,c)=>{ const v = y > r.y-0.05 ? 1 : 0.6; c.setRGB(v,v,v); }); grassG.push(g);
    for (let fx=r.x0-0.04; fx<r.x1+0.04; fx += 0.15+R()*0.07) fringeL.push([fx, r.y-0.3, SOIL_Z1+0.05, R()*3, 0.7+R()*0.6]);
  }
  for (const r of topRuns(B,2)){
    const g = boxGeo(r.x0-0.04, r.y-0.14, STONE_Z0-0.04, r.x1+0.04, r.y+0.02, STONE_Z1+0.05); triUV(g,0.6);
    paint(g,(x,y,z,c)=>{ const v = y > r.y-0.05 ? 0.78 : 0.5; c.setRGB(v,v,v); }); grassG.push(g);
    for (let fx=r.x0; fx<r.x1; fx += 0.2+R()*0.1) fringeL.push([fx, r.y-0.12, STONE_Z1+0.03, R()*3, 0.5+R()*0.4]);
  }
  if (grassG.length) addMesh(keep(mergeGeos(grassG)), mGrass, true, true);
  group.add(instanced(GEO.fringe, keep(new THREE.MeshStandardMaterial({ color:lin(T.fringe), roughness:0.9 })), fringeL, null, {recv:true}));

  /* stone */
  const stoneG = [];
  for (const r of columnRuns(B,2)){
    const g = boxGeo(r.x0, r.y0, STONE_Z0, r.x1, r.y1, STONE_Z1); triUV(g,0.5);
    paint(g,(x,y,z,c)=>{ const v = 0.5 + 0.5*clamp((y-r.y0)/Math.max(1,r.y1-r.y0),0,1); c.setRGB(v,v,v); }); stoneG.push(g);
    for (let x=r.x0;x<r.x1;x++){
      const rr = 0.22+R()*0.2, hh = 0.4+R()*0.7;
      const g2 = xform(new THREE.ConeGeometry(rr,hh,5,1), [x+0.25+R()*0.5, r.y0-hh/2+0.04, lerp(STONE_Z0+0.4, STONE_Z1-0.3, R())], [Math.PI,R()*3,0]);
      triUV(g2,0.5); paint(g2,(px,py,pz,c)=>c.setRGB(0.42,0.42,0.45)); stoneG.push(g2);
    }
  }
  if (stoneG.length) addMesh(keep(mergeGeos(stoneG)), mStone, true, true);

  /* planks */
  const woodG = [];
  for (let y=0;y<H;y++){ let x=0; while (x<W){ if (grid[y*W+x]===3){ let x1=x; while (x1<W && grid[y*W+x1]===3) x1++; const top = y+1;
    const g = boxGeo(x+0.03, top-0.24, PLANK_Z0, x1-0.03, top, PLANK_Z1); triUV(g,0.5); paint(g,(px,py,pz,c)=>{ const v = py > top-0.02 ? 1 : 0.68; c.setRGB(v,v,v); }); woodG.push(g);
    for (const bx of [x+0.25, x1-0.45]){ const b = boxGeo(bx, top-0.38, PLANK_Z0+0.12, bx+0.2, top-0.24, PLANK_Z1-0.12); triUV(b,0.5); paint(b,(px,py,pz,c)=>c.setRGB(0.5,0.5,0.5)); woodG.push(b); }
    x = x1; } else x++; } }
  if (woodG.length) addMesh(keep(mergeGeos(woodG)), mWood, true, true);

  /* cracked rocks */
  L.cracks = new Map();
  for (const c of B.cracks){
    const m = new THREE.Mesh(GEO.crack, MAT.crack); m.position.set(c.x+0.5, c.y+0.49, -0.08); m.castShadow = true; m.receiveShadow = true; group.add(m);
    L.cracks.set(c.y*W + c.x, { x:c.x, y:c.y, content:c.content, mesh:m });
  }

  /* decoration */
  const reserved = new Set();
  [...B.springs, ...B.checks].forEach(o => { const fx = Math.floor(o.x); reserved.add(fx-1); reserved.add(fx); reserved.add(fx+1); });
  if (B.goal) for (let i=-3;i<=3;i++) reserved.add(Math.floor(B.goal.x)+i);
  if (B.arena) for (let x=B.arena.gate[0]-1; x<=B.arena.gate[1]+1; x++) reserved.add(x);
  const tuftL=[], tuftC=[], headL=[], headC=[], stemL=[], trunkG=[], leafG=[], rockG=[], crystalL=[], crystalC=[];
  const tuftPal = T.tuft.map(lin), flowerPal = T.flower.map(lin), crystalPal = ['#9fdcff','#c9a8ff','#7fe9ff','#ffb3e6'].map(lin);
  for (const r of topRuns(B,1)){
    for (let x=r.x0;x<r.x1;x++){
      for (let k=0;k<6;k++){ const z = lerp(SOIL_Z0+0.12, SOIL_Z1-0.05, R()); if (Math.abs(z) < 0.3 && R() < 0.7) continue; tuftL.push([x+R(), r.y+0.01, z, R()*3, 0.7+R()*0.7, (R()-0.5)*0.5, (R()-0.5)*0.5]); tuftC.push(pick(tuftPal,R)); }
      if (R() < 0.45){ const fx = x+R(), fz = R()<0.5 ? lerp(-2.4,-0.6,R()) : lerp(0.5,1.05,R()), s = 0.8+R()*0.5; headL.push([fx, r.y, fz, 0, s]); headC.push(pick(flowerPal,R)); stemL.push([fx, r.y, fz, 0, s]); }
      if (T.crystals && R() < 0.16 && !reserved.has(x)){ crystalL.push([x+R(), r.y, lerp(-2.5,-1.3,R()), R()*3, 0.6+R()*0.9, (R()-0.5)*0.3, (R()-0.5)*0.3]); crystalC.push(pick(crystalPal,R)); }
      if (reserved.has(x)) continue;
      const roll = R();
      if (roll < 0.1 && r.x1-r.x0 >= 2) addTree(x+0.5, r.y, -1.95-R()*0.55, 0.75+R()*0.6, R, T, trunkG, leafG);
      else if (roll < 0.32) leafG.push(solidPart(GEO.ico, pick(T.leaf,R), [x+R(), r.y+0.15, lerp(-2.3,-1.2,R())], [R(),R(),R()], [0.45+R()*0.3, 0.38+R()*0.2, 0.45+R()*0.3]));
      else if (roll < 0.38) leafG.push(solidPart(GEO.ico, pick(T.leaf,R), [x+R(), r.y+0.08, lerp(0.75,1.0,R())], [R(),R(),R()], [0.28+R()*0.12, 0.22, 0.25]));
      if (R() < 0.07) rockG.push(solidPart(GEO.rock, T.rock, [x+R(), r.y+0.05, lerp(-2.3,-1.0,R())], [R(),R(),R()], [1+R(),0.7+R()*0.5,1+R()]));
    }
  }
  for (const r of topRuns(B,2)) for (let x=r.x0;x<r.x1;x++) for (let k=0;k<3;k++){ const z = lerp(STONE_Z0+0.1, STONE_Z1-0.05, R()); if (Math.abs(z) < 0.3) continue; tuftL.push([x+R(), r.y, z, R()*3, 0.5+R()*0.5, (R()-0.5)*0.5, 0]); tuftC.push(pick(tuftPal,R)); }
  group.add(instanced(GEO.tuft, keep(addWind(new THREE.MeshStandardMaterial({ roughness:0.9 }), 0.55, 'inst')), tuftL, tuftC, {recv:true}));
  const fHeadMat = keep(addWind(new THREE.MeshStandardMaterial({ roughness:0.6, emissive:lin(T.flowerGlow > 0 ? '#7fd8ff' : '#000000'), emissiveIntensity:T.flowerGlow }), 0.55, 'inst'));
  group.add(instanced(GEO.fHead, fHeadMat, headL, headC));
  group.add(instanced(GEO.fStem, keep(addWind(new THREE.MeshStandardMaterial({ color:lin(T.fringe), roughness:0.9 }), 0.55, 'inst')), stemL, null));
  if (crystalL.length) group.add(instanced(GEO.crystal, keep(new THREE.MeshStandardMaterial({ roughness:0.1, emissive:lin('#5a6bff'), emissiveIntensity:0.9, flatShading:true })), crystalL, crystalC, {cast:true}));
  if (trunkG.length) addMesh(keep(mergeGeos(trunkG)), mFlat, true, false);
  if (leafG.length) addMesh(keep(mergeGeos(leafG)), mLeaf, true, true);
  if (rockG.length) addMesh(keep(mergeGeos(rockG)), mFlat, true, true);

  /* far background */
  const farG = [], farTrunk = [], farLeaf = [];
  const mR = rng((def.seed||1)*7+3);
  for (let x=-140; x<W+140; x += 24+mR()*22){
    const h = 26+mR()*44, r = h*(0.7+mR()*0.4), z = -165-mR()*70;
    farG.push(gradPart(new THREE.ConeGeometry(r,h,7,3), T.mountain[0], T.mountain[1], [x, -4+h/2, z], [0,mR()*3,0], null, h > 52 ? {c:T.snow, at:0.74} : null));
  }
  for (let x=-30; x<W+30; x += 10+mR()*12){
    const z = -42-mR()*46, y = 6+mR()*17, s = 1+mR()*2.2, r = 1.6*s, h = 2.6*s;
    farG.push(gradPart(new THREE.ConeGeometry(r,h,7,2), T.islandRock[0], T.islandRock[1], [x, y-h/2, z], [Math.PI, mR()*3, 0]));
    farG.push(solidPart(new THREE.CylinderGeometry(r*1.06, r*0.98, 0.45*s, 7), T.islandGrass, [x, y+0.2*s, z], [0, mR()*3, 0]));
    const nt = 1 + Math.floor(mR()*3);
    for (let k=0;k<nt;k++) addTree(x+(mR()-0.5)*r*1.1, y+0.42*s, z+(mR()-0.5)*r*0.7, 0.55*s*(0.7+mR()*0.5), mR, T, farTrunk, farLeaf);
  }
  addMesh(keep(mergeGeos(farG.concat(farTrunk, farLeaf))), mFar, false, false);

  const clouds = []; let puffN = 0;
  for (let x=-40; x<W+60; x += 11+mR()*14){
    const c = { x, y:13+mR()*17, z:-32-mR()*62, sp:0.25+mR()*0.45, puffs:[] }, n = 4+Math.floor(mR()*4), sc = 1.6+mR()*2.3;
    for (let k=0;k<n;k++) c.puffs.push([ (k-(n-1)/2)*sc*0.72 + (mR()-0.5)*sc*0.4, mR()*sc*0.35, (mR()-0.5)*sc*0.6, sc*(0.62+mR()*0.5) ]);
    puffN += n; clouds.push(c);
  }
  const cloudMesh = new THREE.InstancedMesh(GEO.puff, keep(new THREE.MeshStandardMaterial({ color:lin(T.cloud), emissive:lin(T.cloud), emissiveIntensity:T.cloudGlow, roughness:1 })), puffN);
  cloudMesh.frustumCulled = false; cloudMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); group.add(cloudMesh);

  /* gems */
  L.gems = B.gems.map(g => ({ x:g.x, y:g.y, got:false, pop:0 }));
  L.gemTotal = L.gems.length + B.cracks.reduce((n,c) => n + (c.content.indexOf('gems:') === 0 ? parseInt(c.content.slice(5),10) : 0), 0);
  const gemMesh = new THREE.InstancedMesh(GEO.gem, MAT.gem, Math.max(1,L.gems.length)); gemMesh.castShadow = true; gemMesh.frustumCulled = false; gemMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const haloMesh = new THREE.InstancedMesh(GEO.halo, MAT.halo, Math.max(1,L.gems.length)); haloMesh.frustumCulled = false; haloMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); haloMesh.renderOrder = 2;
  group.add(gemMesh); group.add(haloMesh);

  L.hearts = B.hearts.map(h => { const m = new THREE.Mesh(GEO.heart, MAT.heart); m.castShadow = true; m.position.set(h.x, h.y, 0); group.add(m); return { x:h.x, y:h.y, got:false, mesh:m }; });
  L.springs = B.springs.map(s => {
    const o = new THREE.Group(); o.position.set(s.x, s.y, 0);
    const coil = new THREE.Mesh(SPRING.coil, MAT.metal); coil.castShadow = true; o.add(coil);
    const pad = new THREE.Mesh(SPRING.pad, MAT.pad); pad.position.y = 0.5; pad.castShadow = true; o.add(pad);
    group.add(o); return { x:s.x, y:s.y, comp:0, coil, pad };
  });
  L.movers = B.movers.map(d => new Mover(d, group, own));
  L.checks = B.checks.map(c => {
    const o = new THREE.Group(); o.position.set(c.x, c.y, -0.75);
    const post = new THREE.Mesh(POST, MAT.metal); post.castShadow = true; o.add(post);
    const lm = keep(new THREE.MeshStandardMaterial({ color:lin('#fff1cc'), emissive:lin('#ffb84a'), emissiveIntensity:0.05, roughness:0.4 }));
    const lantern = new THREE.Mesh(LANTERN, lm); lantern.position.set(0.42,1.66,0); o.add(lantern);
    const glow = new THREE.Mesh(GEO.halo, MAT.glowGold); glow.position.set(0.42,1.66,0.25); glow.scale.setScalar(0.001); o.add(glow);
    group.add(o); return { x:c.x, y:c.y, on:false, lm, glow };
  });
  L.spawnItem = (kind, x, cy, bubble, respawn) => { const it = new Item(kind, x, cy, bubble, group, respawn); L.items.push(it); return it; };
  for (const b of B.bubbles) L.spawnItem(b.kind, b.x, b.y, true, b.respawn);

  /* goal portal */
  if (B.goal){
    const o = new THREE.Group(); o.position.set(B.goal.x, B.goal.y, -0.4);
    const pg = keep(mergeGeos([-1,1].flatMap(s => [ triUV(boxGeo(s*1.95-0.3,0,-0.3,s*1.95+0.3,3.7,0.3),0.5), triUV(boxGeo(s*1.95-0.4,3.7,-0.4,s*1.95+0.4,4.0,0.4),0.5) ]).map(g => paint(g,(x,y,z,c)=>{ const v = 0.6+0.4*clamp(y/4,0,1); c.setRGB(v,v,v); }))));
    const pillars = new THREE.Mesh(pg, mStone); pillars.castShadow = true; pillars.receiveShadow = true; o.add(pillars);
    const ringG = keep(new THREE.TorusGeometry(1.65,0.14,14,72)), ringM = keep(new THREE.MeshStandardMaterial({ color:lin('#ffd36b'), emissive:lin('#ffb020'), emissiveIntensity:1.1, metalness:0.6, roughness:0.25 }));
    const ring = new THREE.Mesh(ringG, ringM); ring.position.y = 2.15; ring.castShadow = true; o.add(ring);
    const swirlU = { t:{value:0}, c1:{value:lin('#ffe9a8')}, c2:{value:lin('#7fe9ff')} };
    const discG = keep(new THREE.CircleGeometry(1.52,64)), discM = keep(new THREE.ShaderMaterial({ uniforms:swirlU, transparent:true, depthWrite:false, side:THREE.DoubleSide, blending:THREE.AdditiveBlending,
      vertexShader:'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader:'uniform float t; uniform vec3 c1; uniform vec3 c2; varying vec2 vUv; void main(){ vec2 p = vUv-0.5; float r = length(p)*2.0; float a = atan(p.y,p.x);\n float s = sin(a*5.0 + r*9.0 - t*3.2)*0.5+0.5; float glow = smoothstep(1.0,0.0,r);\n vec3 col = mix(c1,c2,s)*(0.35+0.9*glow); float alpha = (0.35 + 0.5*s)*smoothstep(1.0,0.85,r)*(0.55+0.45*glow); gl_FragColor = vec4(col*alpha, alpha); }' }));
    const disc = new THREE.Mesh(discG, discM); disc.position.y = 2.15; o.add(disc);
    const orbitG = keep(new THREE.OctahedronGeometry(0.16,0));
    const orbs = [0,1,2].map(() => { const m = new THREE.Mesh(orbitG, MAT.gem); o.add(m); return m; });
    group.add(o);
    L.portal = { o, ring, swirlU, orbs, baseY:B.goal.y, rise: B.arena ? 0 : 1 };
    if (B.arena) o.position.y = B.goal.y - 7.5;
  }

  /* boss arena */
  if (B.arena){
    const A = B.arena;
    const gateG = keep(mergeGeos([ triUV(boxGeo(A.gate[0], 0, -1.3, A.gate[1]+1, 9, 1.3), 0.5) ].map(g => paint(g,(x,y,z,c)=>{ const v = 0.45+0.55*clamp(y/9,0,1); c.setRGB(v,v,v); }))));
    L.gate = new THREE.Mesh(gateG, mStone); L.gate.castShadow = true; L.gate.receiveShadow = true; L.gate.position.y = A.floor - 9.6; group.add(L.gate);
    const runeG = keep(new THREE.BoxGeometry(0.08, 7, 0.1));
    const rune = new THREE.Mesh(runeG, MAT.glowLine); rune.position.set((A.gate[0]+A.gate[1]+1)/2, 4.5, 1.32); L.gate.add(rune);
    L.gateK = 0; L.gateTarget = 0;
    L.boss = new Boss(L);
    L.setGate = on => {
      for (const gx of A.gate) for (let y=A.floor; y<A.floor+9; y++) if (gx>=0 && gx<W && y<H) grid[y*W+gx] = on ? 5 : 0;
      L.gateTarget = on ? 1 : 0;
    };
    L.resetBoss = () => {

  const zt = fight ? (camera.aspect < 1 ? 1.45 : 1.16) : 1;

  e.preventDefault(); syncInput();
});
window.addEventListener('keyup', e => { if (KL.includes(e.code)) keys.l = false; else if (KR.includes(e.code)) keys.r = false; else if (KJ.includes(e.code)) keys.j = false; syncInput(); });
const pad = $('pad'), padPtrs = new Map();
function updPad(){ const r = pad.getBoundingClientRect(); let l = false, rt = false; for (const x of padPtrs.values()){ if (x < r.left + r.width/2) l = true; else rt = true; } touchState.l = l; touchState.r = rt; pad.classList.toggle('l-on', l); pad.classList.toggle('r-on', rt); syncInput(); }
pad.addEventListener('pointerdown', e => { e.preventDefault(); try{ pad.setPointerCapture(e.pointerId); }catch(err){} padPtrs.set(e.pointerId, e.clientX); updPad(); });
pad.addEventListener('pointermove', e => { if (padPtrs.has(e.pointerId)){ padPtrs.set(e.pointerId, e.clientX); updPad(); } });
['pointerup','pointercancel','lostpointercapture'].forEach(ev => pad.addEventListener(ev, e => { if (padPtrs.delete(e.pointerId)) updPad(); }));
function touchButton(el, down, up){
  el.addEventListener('pointerdown', e => { e.preventDefault(); try{ el.setPointerCapture(e.pointerId); }catch(err){} el.classList.add('on'); down(); syncInput(); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev => el.addEventListener(ev, () => { el.classList.remove('on'); if (up) up(); syncInput(); }));
}
touchButton($('tjump'), () => { if (!touchState.j) input.jp = true; touchState.j = true; }, () => { touchState.j = false; });
touchButton($('tpound'), () => { input.dp = true; });
touchButton($('tthrow'), () => { input.tp = true; });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('.panel')) e.preventDefault(); }, { passive:false });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('blur', () => { if (Game.state === 'play') clearInput(); });

/* ================= UI ================= */
const SCREENS = ['scr-title','scr-levels','scr-settings','scr-pause','scr-result','scr-over','scr-howto'];
function showScreen(id){ for (const s of SCREENS) $(s).hidden = s !== id; }
function setPlayUI(on){ $('hud').hidden = !on; $('touch').hidden = !(on && isTouch); }
let bannerTimer = 0, toastTimer = 0, hintTimer = 0;
function banner(a, b, boss){ const el = $('banner'); el.innerHTML = ''; el.classList.toggle('boss', !!boss);
  const s1 = document.createElement('span'); s1.className = 'b-id'; s1.textContent = a; const s2 = document.createElement('span'); s2.className = 'b-name'; s2.textContent = b;
  el.append(s1, s2); el.classList.add('show'); clearTimeout(bannerTimer); bannerTimer = setTimeout(() => el.classList.remove('show'), 2400); }
function toast(msg){ const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1600); }
function showHint(html){ const el = $('hint'); el.innerHTML = html; el.classList.add('show'); clearTimeout(hintTimer); hintTimer = setTimeout(() => el.classList.remove('show'), 5200); }
function hintOnce(id, html){ const seen = store.get('hints', {}); if (seen[id]) return; seen[id] = 1; store.set('hints', seen); showHint(html); }
function hudBump(){ const el = $('gems-chip'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function flashVignette(){ const el = $('vignette'); el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 110); }
function showBossBar(on){ $('bossbar').hidden = !on; if (on && Game.lvl && Game.lvl.boss){ document.querySelector('#bossbar .bname').textContent = Game.lvl.boss.name; updateBossBar(Game.lvl.boss); } }
function updateBossBar(b){ const pct = Math.max(0, b.hp/b.maxHp)*100; document.querySelector('#bossbar .bfill').style.width = 'calc(' + pct + '% - 4px)'; document.querySelector('#bossbar .bghost').style.width = 'calc(' + pct + '% - 4px)'; }
const HEART_SVG = '<svg viewBox="0 0 28 26" class="%C"><path d="M14 24.5C6 18.6 2 14 2 8.8 2 5 5 2 8.6 2c2.2 0 4.2 1.1 5.4 2.9C15.2 3.1 17.2 2 19.4 2 23 2 26 5 26 8.8c0 5.2-4 9.8-12 15.7z" fill="#ff4d6d" stroke="#fff" stroke-width="2.2"/><path d="M8.5 6.2c-1.6.3-2.7 1.6-2.8 3.2" stroke="#ffd0d8" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const hudLast = { hearts:-1, lives:-1, gems:-1, total:-1, time:-1 };
function updateHud(){
  if (Game.state !== 'play' && Game.state !== 'dying' && Game.state !== 'pause') return;
  if (hudLast.hearts !== P.hearts){ hudLast.hearts = P.hearts; let s = ''; for (let i=0;i<3;i++) s += HEART_SVG.replace('%C', i < P.hearts ? 'on' : 'off'); $('hearts').innerHTML = s; }
  const lv = Math.max(0, P.lives); if (hudLast.lives !== lv){ hudLast.lives = lv; $('lives').textContent = '×' + lv; }
  if (hudLast.gems !== Game.gems || hudLast.total !== Game.lvl.gemTotal){ hudLast.gems = Game.gems; hudLast.total = Game.lvl.gemTotal; $('gems').textContent = Game.gems + ' / ' + Game.lvl.gemTotal; }
  const tt = Math.floor(Game.time); if (hudLast.time !== tt){ hudLast.time = tt; $('timer').textContent = fmtTime(tt); }
}
function renderLevelList(){
  const prog = store.get('progress', { unlocked:1, best:{} }), list = $('level-list'); list.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button'); b.className = 'btn lv' + (lv.boss ? ' boss' : (i === 0 ? ' primary' : ''));
    const locked = i + 1 > (prog.unlocked || 1); b.disabled = locked;
    const best = prog.best && prog.best[lv.id];
    const a = document.createElement('span'); a.className = 'lv-id'; a.textContent = lv.id;
    const n = document.createElement('span'); n.className = 'lv-name'; n.textContent = lv.name + (lv.boss ? '（魔王關）' : '');
    const d = document.createElement('span'); d.className = 'lv-best'; d.textContent = locked ? '通過上一關後開放' : (best ? '最佳：星晶 ' + best.gems + '/' + best.total + '，' + fmtTime(best.time) : '還沒通過');
    b.append(a, n, d); b.addEventListener('click', () => startLevel(i, false)); list.appendChild(b);
  });
}
function renderHowto(){
  const rows = isTouch
    ? [['移動','左下方向盤，手指可以左右滑'],['跳躍','「跳」，按越久跳越高'],['二段跳','空中再按一次「跳」'],['下砸','空中按「砸」：打碎發光裂岩、震飛附近敵人'],['丟回力葉','拿到疾風葉後按「丟」，葉子會飛回來'],['踩敵人','從上方落下可以踩扁甲蟲和蜜蜂，刺球不能踩']]
    : [['移動','← →（或 A D）'],['跳躍','空白鍵、↑、W，按越久跳越高'],['二段跳','空中再按一次跳'],['下砸','空中按 ↓（或 S）：打碎發光裂岩、震飛附近敵人'],['丟回力葉','拿到疾風葉後按 X，葉子會飛回來'],['暫停','Esc 或 P']];
  const dl = $('howto-list'); dl.innerHTML = '';
  for (const r of rows){ const dt = document.createElement('dt'); dt.textContent = r[0]; const dd = document.createElement('dd'); dd.textContent = r[1]; dl.append(dt, dd); }
}
function syncSettings(){
  $('tg-sfx').setAttribute('aria-checked', String(Sound.sfxOn)); $('tg-music').setAttribute('aria-checked', String(Sound.musicOn));
  $('seg-q').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === quality)));
}
function applyQuality(q){
  quality = q; store.set('quality', q);
  const shadows = q !== 'eco'; renderer.shadowMap.enabled = shadows; sun.castShadow = shadows;
  scene.traverse(o => { const m = o.material; if (!m) return; (Array.isArray(m) ? m : [m]).forEach(x => x.needsUpdate = true); });
  resize(); syncSettings();
}
$('btn-start').addEventListener('click', () => startLevel(0, false));
$('btn-levels').addEventListener('click', () => { renderLevelList(); showScreen('scr-levels'); });
$('btn-levels-back').addEventListener('click', () => showScreen('scr-title'));
$('btn-howto').addEventListener('click', () => { renderHowto(); showScreen('scr-howto'); });
$('btn-howto-done').addEventListener('click', () => showScreen('scr-title'));
$('btn-settings').addEventListener('click', () => { Game.settingsBack = 'scr-title'; syncSettings(); showScreen('scr-settings'); });
$('btn-pause-settings').addEventListener('click', () => { Game.settingsBack = 'scr-pause'; syncSettings(); showScreen('scr-settings'); });
$('btn-settings-done').addEventListener('click', () => showScreen(Game.settingsBack));
$('tg-sfx').addEventListener('click', () => { Sound.init(); Sound.setSfx(!Sound.sfxOn); syncSettings(); Sound.sfx('gem'); });
$('tg-music').addEventListener('click', () => { Sound.init(); Sound.setMusic(!Sound.musicOn); syncSettings(); });
$('seg-q').querySelectorAll('button').forEach(b => b.addEventListener('click', () => applyQuality(b.dataset.q)));
$('btn-pause').addEventListener('click', () => pauseGame());
$('btn-resume').addEventListener('click', () => resumeGame());
$('btn-restart').addEventListener('click', () => startLevel(Game.idx, false));

$('btn-home').addEventListener('click', () => toTitle());
$('btn-over-retry').addEventListener('click', () => startLevel(Game.idx, false));
$('btn-over-home').addEventListener('click', () => toTitle());
$('ver').textContent = 'v' + VERSION;

/* ================= main loop ================= */
let last = performance.now(), acc = 0, loopErr = false;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now; if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
  if (!Game.lvl) return;
  try { update(dt); render(); }
  catch(err){ if (!loopErr){ loopErr = true; showErr('執行錯誤：' + err.message); } }
}
function update(rdt){
  const L = Game.lvl;
  if (Game.state !== 'pause'){ Game.clock += rdt; if (Game.slow > 0) Game.slow -= rdt; }
  const dt = rdt*(Game.slow > 0 ? 0.35 : 1);
  if (Game.state === 'play'){
    if (Game.freeze > 0) Game.freeze -= rdt;
    else {
      if (input.jp){ P.buffer = 0.13; input.jp = false; }
      if (input.dp){ input.dp = false; startPound(); }
      if (input.tp){ input.tp = false; throwLeaf(); }
      P.pfb = P.y; acc += dt; let n = 0;
      while (acc >= STEP && n < 14){ L.t += STEP; for (const m of L.movers) m.step(L.t); physStep(STEP); for (const e of L.enemies) e.step(STEP); acc -= STEP; n++; if (Game.state !== 'play') break; }
      if (n >= 14) acc = 0;
      if (Game.state === 'play'){ interact(); Game.time += dt; }
      L.updateEntities(dt);
    }
  } else if (Game.state !== 'pause'){
    L.t += dt; for (const m of L.movers) m.step(L.t); for (const e of L.enemies) e.step(dt); L.updateEntities(dt);
    if (Game.state === 'dying') updDying(rdt); else if (Game.state === 'clear') updClear(rdt);
  }
  if (Game.state !== 'pause'){
    const t = Game.clock; waterU.t.value = t; WIND.value = t; MAT.bubble.uniforms.t.value = t;
    L.updateVisual(dt, t); updateHero(dt, t); updateMotes(dt, t); updateParticles(dt); updateFloats(rdt);
    updateCamera(rdt, false);
  }
  updateHud();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
{ const sh = quality !== 'eco'; renderer.shadowMap.enabled = sh; sun.castShadow = sh; }
hero.formScale = 1;
resize();
toTitle();
requestAnimationFrame(frame);
})();
